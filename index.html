<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Assistente Pessoal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #00f0ff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #00f0ff33;
            background: #101520;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background: #005577;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .jarvis-message {
            align-self: flex-start;
            background: #16222f;
            color: #00f0ff;
            border: 1px solid #00f0ff44;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 12px;
            background: #101520;
            border-top: 1px solid #00f0ff33;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .api-input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #00f0ff44;
            background: #0b0e14;
            color: #00f0ff;
            border-radius: 5px;
            outline: none;
        }
        input::placeholder {
            color: #00f0ff66;
        }
        button {
            padding: 10px 16px;
            background: #00f0ff;
            color: #0b0e14;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover {
            background: #00c8d6;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S.</h1>
    </header>

    <div id="chat-container">
        <div class="message jarvis-message">
            Sistemas online. Em que posso ajudar hoje, Caio?
        </div>
    </div>

    <div id="controls">
        <div class="api-input-group">
            <input type="password" id="api-key" placeholder="Insira a sua Chave de API do Gemini...">
        </div>
        <div class="api-input-group">
            <input type="text" id="user-input" placeholder="Digite o seu comando...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>
